<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Food Slicer</title>
  <link href="./assets/favicon.ico" rel="icon">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0b0f14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 2; }
    .topbar a { color: #9bd6ff; text-decoration: none; }
    .hud { display: flex; gap: 16px; align-items: center; font-weight: 600; }
    .wrap { position: relative; height: 100%; width: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .overlay { background: rgba(0,0,0,0.55); padding: 20px 24px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); pointer-events: auto; }
    .btn { margin-top: 12px; padding: 10px 16px; border: none; border-radius: 8px; background: #19c37d; color: #071018; font-weight: 700; cursor: pointer; }
    .btn:active { transform: translateY(1px); }
    .legend { font-size: 12px; opacity: 0.8; margin-top: 8px; }
    #leaderboard { margin-top: 12px; text-align: left; font-size: 14px; }
    #leaderboard p { margin: 2px 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="./index.html">← Back</a>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="game"></canvas>
    <audio id="bgm" src="./assets/gamesong.mp3" loop preload="auto" style="display:none"></audio>

    <div class="center" id="menu">
      <div class="overlay">
        <h2>Chinese Food Slicer</h2>
        <div class="legend">Slice the food with mouse or finger. Avoid bombs!</div>
        <button class="btn" id="startBtn">Start</button>
        <div id="leaderboard"></div>
      </div>
    </div>

    <div class="center" id="gameover" style="display:none;">
      <div class="overlay">
        <h2>Game Over</h2>
        <div>Final Score: <span id="finalScore">0</span></div>
        <button class="btn" id="restartBtn">Play Again</button>
        <div id="leaderboard-over"></div>
      </div>
    </div>
  </div>

  <!-- Firebase and Game Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASEX_ykVUPqdkJpS9YCyknofSv9AAFnuE",
      authDomain: "shapeshooterleaderboard.firebaseapp.com",
      projectId: "shapeshooterleaderboard",
      storageBucket: "shapeshooterleaderboard.firebasestorage.app",
      messagingSenderId: "236981304423",
      appId: "1:236981304423:web:328b4971e629402a9768c2",
      measurementId: "G-3JECE7LP88"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Leaderboard functions
    async function saveScore(name, score) {
      try { await addDoc(collection(db, "leaderboard"), { name, score }); } 
      catch (e) { console.error(e); }
    }

    async function loadLeaderboard(el) {
      const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(5));
      const snapshot = await getDocs(q);
      const results = [];
      snapshot.forEach(doc => results.push(doc.data()));
      el.innerHTML = results.map((p,i)=> `<p>${i+1}. ${p.name} — ${p.score}</p>`).join("");
    }

    // Prompt for player name once
    let playerName = localStorage.getItem("playerName");
    if(!playerName){
      playerName = prompt("Enter your name:");
      if(!playerName) playerName = "Player";
      localStorage.setItem("playerName", playerName);
    }

    // --- GAME CODE BELOW ---
    (function() {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const menuEl = document.getElementById('menu');
      const overEl = document.getElementById('gameover');
      const finalScoreEl = document.getElementById('finalScore');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const leaderboardMenu = document.getElementById("leaderboard");
      const leaderboardOver = document.getElementById("leaderboard-over");
      const bgm = document.getElementById('bgm');

      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize); requestAnimationFrame(resize);

      const faceImg = new Image(); faceImg.src = './assets/images/Aryan.png';
      let faceReady = false; faceImg.onload = () => { faceReady = true; };

      let rng = Math.random, running = false, score = 0, lives = 3, time = 0, lastEmit = 0, emitInterval = 1100, particles = [], trail = [];

      const FOODS = ['🥟','🍜','🍚','🍣','🍤','🥠','🍱'], BOMB = '💣';
      function rand(min,max){return min + rng()*(max-min);}
      function spawnItem(){ 
        const isBomb = rng()<Math.min(0.12+score*0.001,0.28);
        const glyph = isBomb?BOMB:FOODS[Math.floor(rand(0,FOODS.length))];
        const x = canvas.width*0.5 + rand(-60,60), y = canvas.height+30;
        const heightScale = Math.max(1, canvas.height/700);
        const difficulty = 1+Math.min(1.0, time/30);
        const speed = rand(420,620)*heightScale*difficulty;
        const angle = rand(-Math.PI*0.62,-Math.PI*0.45);
        let vx = Math.cos(angle)*(speed/60)*0.25;
        const vy = Math.sin(angle)*(speed/60);
        const spin = rand(-0.06,0.06);
        const size = rand(44,68);
        particles.push({type:'item',glyph,isBomb,x,y,vx,vy,ax:0,ay:0.34,r:0,spin,size,sliced:false,life:0});
      }

      function spawnJuice(x,y,color){for(let i=0;i<12;i++){particles.push({type:'juice',x,y,vx:rand(-4,4),vy:rand(-6,-1),ay:0.3,life:1,color});}}
      function spawnShards(item){for(let i=0;i<6;i++){particles.push({type:'shard',x:item.x,y:item.y,vx:rand(-4,4),vy:rand(-3,-0.5),ay:0.35,r:rand(0,Math.PI*2),spin:rand(-0.2,0.2),life:1,color:'#ffd27d'});}}

      const pointer = {x:0,y:0,px:0,py:0,down:false};
      function setPointer(x,y){pointer.px=pointer.x;pointer.py=pointer.y;pointer.x=x;pointer.y=y;trail.push({x,y,life:1});if(trail.length>24)trail.shift();}
      canvas.addEventListener('mousemove',e=>setPointer(e.offsetX,e.offsetY));
      canvas.addEventListener('mousedown',()=>pointer.down=true);
      canvas.addEventListener('mouseup',()=>pointer.down=false);
      canvas.addEventListener('mouseleave',()=>pointer.down=false);
      canvas.addEventListener('touchstart',e=>{pointer.down=true;const t=e.touches[0];const rect=canvas.getBoundingClientRect(); setPointer(t.clientX-rect.left,t.clientY-rect.top);},{passive:true});
      canvas.addEventListener('touchmove',e=>{const t=e.touches[0];const rect=canvas.getBoundingClientRect();setPointer(t.clientX-rect.left,t.clientY-rect.top);},{passive:true});
      canvas.addEventListener('touchend',()=>pointer.down=false);

      function lineIntersectsCircle(x1,y1,x2,y2,cx,cy,cr){
        const dx=x2-x1,dy=y2-y1,fx=x1-cx,fy=y1-cy,a=dx*dx+dy*dy,b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-cr*cr;
        let t=-b/(2*a);t=Math.max(0,Math.min(1,t));
        const rx=x1+dx*t,ry=y1+dy*t,dist2=(rx-cx)*(rx-cx)+(ry-cy)*(ry-cy);
        return dist2<=cr*cr;
      }

      function update(dt){
        time+=dt;
        if(time-lastEmit>emitInterval/1000){lastEmit=time;const count=1+(rng()<Math.min(0.25+score*0.001,0.6)?1:0);for(let i=0;i<count;i++)spawnItem();emitInterval=Math.max(450,1100-score*3);}
        for(let i=particles.length-1;i>=0;i--){
          const p=particles[i];
          if(p.type==='item'){
            p.vx+=p.ax*dt*60;p.vy+=p.ay*dt*60;p.x+=p.vx;p.y+=p.vy;p.r+=p.spin;p.life+=dt;
            if(p.y>canvas.height+60){if(!p.isBomb&&!p.sliced){lives-=1;livesEl.textContent=String(lives);if(lives<=0)endGame();}particles.splice(i,1);continue;}
            if(pointer.down&&(pointer.x!==pointer.px||pointer.y!==pointer.py)&&!p.sliced){
              const hit=lineIntersectsCircle(pointer.px,pointer.py,pointer.x,pointer.y,p.x,p.y,p.size);
              if(hit){if(p.isBomb){lives-=1;livesEl.textContent=String(lives);spawnJuice(p.x,p.y,'#ff4d4d');particles.splice(i,1);if(lives<=0){endGame();return;}}else{p.sliced=true;score+=1;scoreEl.textContent=String(score);spawnJuice(p.x,p.y,'#f9d162');spawnShards(p);particles.splice(i,1);}}}} 
          else if(p.type==='juice'){p.vy+=p.ay;p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.2;if(p.life<=0)particles.splice(i,1);} 
          else if(p.type==='shard'){p.vy+=p.ay;p.x+=p.vx;p.y+=p.vy;p.r+=p.spin;p.life-=dt*1.1;if(p.life<=0)particles.splice(i,1);}
        }
        for(let i=trail.length-1;i>=0;i--){trail[i].life-=dt*2.5;if(trail[i].life<=0)trail.splice(i,1);}
      }

      function render(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const g=ctx.createRadialGradient(canvas.width*0.5,canvas.height*0.6,0,canvas.width*0.5,canvas.height*0.6,Math.max(canvas.width,canvas.height)*0.8);
        g.addColorStop(0,'#0b0f14'); g.addColorStop(1,'#020305'); ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
        if(faceReady&&faceImg.width>0&&faceImg.height>0){const scale=Math.min(canvas.width/faceImg.width,canvas.height/faceImg.height);const drawW=faceImg.width*scale;const drawH=faceImg.height*scale;const dx=(canvas.width-drawW)/2;const dy=(canvas.height-drawH)/2;ctx.drawImage(faceImg,dx,dy,drawW,drawH);}
        ctx.lineWidth=4; ctx.lineCap='round';
        for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];ctx.strokeStyle=`rgba(155,214,255,${Math.max(0,b.life)})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
        for(const p of particles){
          if(p.type==='item'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.font=`${p.size}px system-ui, Apple Color Emoji, Segoe UI Emoji`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.glyph,0,0);ctx.restore();}
          else if(p.type==='juice'){ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
          else if(p.type==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.color;ctx.fillRect(-3,-6,6,12);ctx.restore();}
        }
      }

      let lastTs=0;
      function tick(ts){if(!running)return;const dt=Math.min(0.033,(ts-lastTs)/1000||0.016);lastTs=ts;update(dt);render();requestAnimationFrame(tick);}
      function resetGame(){score=0;lives=3;time=0;lastEmit=0;emitInterval=1100;particles=[];trail=[];scoreEl.textContent='0';livesEl.textContent='3';}
      function startMusic(){try{if(bgm){bgm.volume=0.2;bgm.currentTime=0;bgm.play();}}catch(e){}}
      function stopMusic(){try{if(bgm){bgm.pause();bgm.currentTime=0;}}catch(e){}}
      function startGame(){resetGame();running=true;menuEl.style.display='none';overEl.style.display='none';lastTs=performance.now();startMusic();requestAnimationFrame(tick);}
      async function endGame(){running=false;finalScoreEl.textContent=String(score);overEl.style.display='flex';stopMusic();await saveScore(playerName,score); await loadLeaderboard(leaderboardOver);}

      startBtn.addEventListener('click', async ()=>{
        await loadLeaderboard(leaderboardMenu);
        startGame();
      });
      restartBtn.addEventListener('click', startGame);
      window.addEventListener('keydown', (e)=>{if(e.key==='Enter'||e.key===' '){if(!running)startGame();}});
    })();
  </script>
</body>
</html>
