<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Food Slicer</title>
  <link href="./assets/favicon.ico" rel="icon">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0b0f14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 2; }
    .topbar a { color: #9bd6ff; text-decoration: none; }
    .hud { display: flex; gap: 16px; align-items: center; font-weight: 600; }
    .wrap { position: relative; height: 100%; width: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .overlay { background: rgba(0,0,0,0.55); padding: 20px 24px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); pointer-events: auto; }
    .btn { margin-top: 12px; padding: 10px 16px; border: none; border-radius: 8px; background: #19c37d; color: #071018; font-weight: 700; cursor: pointer; }
    .btn:active { transform: translateY(1px); }
    .legend { font-size: 12px; opacity: 0.8; margin-top: 8px; }
    #leaderboard { margin-top: 12px; text-align: left; font-size: 14px; }
    #leaderboard p { margin: 2px 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="./index.html">← Back</a>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="game"></canvas>
    <audio id="bgm" src="./assets/gamesong.mp3" loop preload="auto" style="display:none"></audio>

    <div class="center" id="menu">
      <div class="overlay">
        <h2>Chinese Food Slicer</h2>
        <div class="legend">Slice the food with mouse or finger. Avoid bombs!</div>
        <button class="btn" id="startBtn">Start</button>
        <div id="leaderboard"></div>
      </div>
    </div>

    <div class="center" id="gameover" style="display:none;">
      <div class="overlay">
        <h2>Game Over</h2>
        <div>Final Score: <span id="finalScore">0</span></div>
        <button class="btn" id="restartBtn">Play Again</button>
        <div id="leaderboard-over"></div>
      </div>
    </div>
  </div>

  <!-- Firebase and Game Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // 🔒 Firebase config (keys removed for security)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY_HERE",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID",
      measurementId: "YOUR_MEASUREMENT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    let playerName = localStorage.getItem("playerName");
    if (!playerName) {
      playerName = prompt("Enter your name:") || "Player";
      localStorage.setItem("playerName", playerName);
    }

    async function loadLeaderboard(el) {
      const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(5));
      const snapshot = await getDocs(q);
      const results = [];
      snapshot.forEach(doc => results.push(doc.data()));
      el.innerHTML = results.map((p,i)=> `<p>${i+1}. ${p.name} — ${p.score}</p>`).join("");
    }

    async function saveScoreIfTop(name, score) {
      const leaderboardRef = collection(db, "leaderboard");
      const q = query(leaderboardRef, orderBy("score", "desc"), limit(5));
      const snapshot = await getDocs(q);

      let entries = [];
      let playerEntry = null;

      snapshot.forEach(doc => {
        const data = doc.data();
        data.id = doc.id;
        entries.push(data);
        if (data.name === name) playerEntry = { ...data, id: doc.id };
      });

      if (playerEntry) {
        if (score > playerEntry.score) {
          await setDoc(doc(db, "leaderboard", playerEntry.id), { name, score });
        }
      } else {
        if (entries.length < 5 || score > entries[entries.length - 1].score) {
          await addDoc(leaderboardRef, { name, score });
        }
      }
    }

    // --- GAME CODE BELOW (unchanged) ---
    (function() {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const menuEl = document.getElementById('menu');
      const overEl = document.getElementById('gameover');
      const finalScoreEl = document.getElementById('finalScore');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const leaderboardMenu = document.getElementById("leaderboard");
      const leaderboardOver = document.getElementById("leaderboard-over");
      const bgm = document.getElementById('bgm');
      // ... rest of your original game code remains unchanged ...
    })();
  </script>
</body>
</html>
