<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sohaan Chhabra Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <style>
    /* Global Resets */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      height: 100%;
      background: #000;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    /* ===== GREETING SCREEN (CENTRE ALIGNED) ===== */
    #greeting-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a1a1a, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .greetings-container {
      height: 80px; /* Prevents layout jumping */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .greetings-text {
      font-size: 4.5rem;
      font-weight: 300;
      color: #ffffff;
      text-align: center;
      letter-spacing: 5px;
      /* The "White Collar" Glow */
      text-shadow: 0 0 10px rgba(255,255,255,0.8), 
                   0 0 20px rgba(255,255,255,0.4);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }

    .greetings-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    .skip-text {
      position: absolute;
      bottom: 50px;
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ===== MAIN CONTENT ===== */
    #main-content {
      opacity: 0; /* Hidden initially */
      transition: opacity 1s ease;
      padding-top: 50px;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(0, 0, 0, 0.9);
      border: none;
      backdrop-filter: blur(10px);
    }

    .navbar-inverse .navbar-nav > li > a {
      color: #ccc;
      transition: 0.3s;
      letter-spacing: 1px;
    }

    .navbar-inverse .navbar-nav > li > a:hover {
      color: #fff;
      text-shadow: 0 0 8px #fff;
    }

    /* ===== HERO SECTION ===== */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      /* Replace with your space.jpg path */
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                  url('./assets/images/space.jpg') center/cover;
    }

    .hero h1 {
      color: #fff;
      font-size: 5.5rem;
      font-weight: 700;
      margin: 0;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    .hero span {
      display: block;
      margin-top: 20px;
      font-size: 1.5rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.8);
    }

    /* Mobile Tweaks */
    @media (max-width: 768px) {
      .hero h1 { font-size: 3rem; }
      .greetings-text { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

<div id="greeting-screen">
  <div class="greetings-container">
    <div class="greetings-text active" id="greeting-target">Hello</div>
  </div>
  <div class="skip-text">Tap to enter</div>
</div>

<div id="main-content">
  <nav class="navbar navbar-fixed-top navbar-inverse">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-collapse">
          <span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse" id="navbar-collapse">
        <ul class="nav navbar-nav navbar-right">
          <li><a href="#">01 : Home</a></li>
          <li><a href="#">02 : Projects</a></li>
          <li><a href="#">03 : About</a></li>
          <li><a href="#">04 : Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="hero">
    <h1>Sohaan Chhabra</h1>
    <span>Robotics • Drones • Engineering</span>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<script>
  const phrases = ["Hello", "नमस्ते", "こんにちは", "안녕하세요", "مرحبا", "Привет", "你好", "שלום"];
  let i = 0;
  const target = document.getElementById("greeting-target");
  const screen = document.getElementById("greeting-screen");
  const main = document.getElementById("main-content");

  // Cycle the text
  const interval = setInterval(() => {
    target.classList.remove("active"); // Slide out/fade
    
    setTimeout(() => {
      i = (i + 1) % phrases.length;
      target.innerText = phrases[i];
      target.classList.add("active"); // Slide in/fade
    }, 500);
  }, 1500);

  function enterSite() {
    clearInterval(interval);
    screen.style.opacity = "0";
    screen.style.visibility = "hidden";
    main.style.opacity = "1";
    document.body.style.overflow = "auto";
  }

  // Automatic entry after 5 seconds or on click
  setTimeout(enterSite, 5500);
  screen.addEventListener("click", enterSite);
</script>

</body>
</html>
