<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sohaan Chhabra Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <link href="./main.3f6952e4.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: black;
      padding-top: 60px;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(0,0,0,0.7);
      border: none;
      z-index: 1000;
    }

    .navbar-nav {
      text-align: center;
    }

    .navbar-nav li {
      margin: 10px 0;
    }

    /* ===== GREETING SCREEN ===== */
    #greeting-screen {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at center, #111, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    .greetings {
      font-size: 3rem;
      color: white;
      text-align: center;
      letter-spacing: 2px;
    }

    .greetings span {
      display: none;
      animation: fade 0.8s ease;
    }

    .greetings span.active {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .skip-text {
      position: absolute;
      bottom: 40px;
      font-size: 0.9rem;
      opacity: 0.6;
      color: white;
    }

    /* ===== MAIN CONTENT ===== */
    #main-content {
      display: none;
      height: 100%;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background: url('./assets/images/space.jpg') center/cover;
    }

    /* Overlay */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      font-size: 3.5rem;
      line-height: 1.3;
      animation: fadeUp 1s ease;
      text-shadow: 0 0 10px rgba(255,255,255,0.6),
                   0 0 25px rgba(255,255,255,0.3);
    }

    .hero span {
      display: block;
      font-size: 1.2rem;
      opacity: 0.8;
      margin-top: 10px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== MOBILE FIX ===== */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }

      .hero span {
        font-size: 1rem;
      }

      .greetings {
        font-size: 2rem;
      }
    }

  </style>
</head>

<body>

<!-- GREETING SCREEN -->
<div id="greeting-screen">
  <div class="greetings" id="greetings">
    <span class="active">Hello</span>
    <span>नमस्ते</span>
    <span>こんにちは</span>
    <span>안녕하세요</span>
    <span>مرحبا</span>
    <span>Привет</span>
    <span>你好</span>
    <span>שלום</span>
  </div>
  <div class="skip-text">tap anywhere to skip</div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">

  <!-- NAVBAR -->
  <nav class="navbar navbar-fixed-top navbar-inverse">
    <div class="container">

      <!-- HAMBURGER -->
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-collapse">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse" id="navbar-collapse">
        <ul class="nav navbar-nav">
          <li><a href="./index.html">01 : Home</a></li>
          <li><a href="./works.html">02 : Projects</a></li>
          <li><a href="./about.html">03 : About me</a></li>
          <li><a href="./contact.html">04 : Contact</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <h1>
      Hello,<br>
      I'm Sohaan Chhabra
      <span>Robotics • Drones • Engineering</span>
    </h1>
  </div>

</div>

<!-- JS -->
<script>
  const greetings = document.querySelectorAll("#greetings span");
  let index = 0;

  function cycleGreetings() {
    greetings.forEach(el => el.classList.remove("active"));
    greetings[index].classList.add("active");
    index = (index + 1) % greetings.length;
  }

  let interval = setInterval(cycleGreetings, 600);

  function enterSite() {
    clearInterval(interval);
    const screen = document.getElementById("greeting-screen");
    screen.style.opacity = "0";

    setTimeout(() => {
      screen.style.display = "none";
      document.getElementById("main-content").style.display = "block";
    }, 600);
  }

  setTimeout(enterSite, 3000);
  document.getElementById("greeting-screen").addEventListener("click", enterSite);
</script>

<!-- REQUIRED FOR NAVBAR -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<script src="./main.70a66962.js"></script>

</body>
</html>
