<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sohaan Chhabra Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link href="./main.3f6952e4.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: black;
      color: white;
    }

    /* ===== GREETING SCREEN (CENTRE ALIGNED) ===== */
    #greeting-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .greetings-wrapper {
      height: 100px; /* Fixed height ensures centering doesn't jump */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .greetings {
      font-size: 4rem;
      font-weight: 300;
      color: white;
      text-align: center;
      letter-spacing: 3px;
      /* The White Collar Glow */
      text-shadow: 0 0 12px rgba(255,255,255,0.7), 
                   0 0 25px rgba(255,255,255,0.3);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease-in-out;
    }

    .greetings.active {
      opacity: 1;
      transform: translateY(0);
    }

    .skip-text {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    /* ===== MAIN CONTENT ===== */
    #main-content {
      opacity: 0;
      visibility: hidden;
      height: 100%;
      transition: opacity 1s ease;
      padding-top: 60px;
    }

    /* ===== NAVBAR (Restored Links) ===== */
    .navbar {
      background: rgba(0,0,0,0.85);
      border: none;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .navbar-nav {
      float: none;
      text-align: center;
    }

    .navbar-nav li {
      display: inline-block;
      float: none;
    }

    .navbar-inverse .navbar-nav > li > a {
      color: #fff;
      transition: 0.3s;
    }

    .navbar-inverse .navbar-nav > li > a:hover {
      text-shadow: 0 0 10px white;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url('./assets/images/space.jpg') center/cover;
    }

    .hero h1 {
      font-size: 4.5rem;
      font-weight: 700;
      margin: 0;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    .hero span {
      display: block;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-top: 15px;
      opacity: 0.8;
    }

    /* Mobile Fixes */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .greetings { font-size: 2.5rem; }
      .navbar-nav li { display: block; }
    }
  </style>
</head>
<body>

<div id="greeting-screen">
  <div class="greetings-wrapper">
    <div class="greetings active" id="greeting-text">Hello</div>
  </div>
  <div class="skip-text">Tap anywhere to skip</div>
</div>

<div id="main-content">
  <nav class="navbar navbar-fixed-top navbar-inverse">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-collapse">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse" id="navbar-collapse">
        <ul class="nav navbar-nav">
          <li><a href="./index.html">01 : Home</a></li>
          <li><a href="./works.html">02 : Projects</a></li>
          <li><a href="./about.html">03 : About me</a></li>
          <li><a href="./contact.html">04 : Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="hero">
    <div>
      <h1>Hello,<br>I'm Sohaan Chhabra</h1>
      <span>Robotics • Drones • Engineering</span>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<script>
  const phrases = ["Hello", "नमस्ते", "こんにちは", "안녕하세요", "مرحبا", "Привет", "你好", "שלום"];
  let i = 0;
  const greetingEl = document.getElementById("greeting-text");
  const screen = document.getElementById("greeting-screen");
  const main = document.getElementById("main-content");

  const interval = setInterval(() => {
    greetingEl.classList.remove("active");
    setTimeout(() => {
      i = (i + 1) % phrases.length;
      greetingEl.textContent = phrases[i];
      greetingEl.classList.add("active");
    }, 400);
  }, 1200);

  function enterSite() {
    clearInterval(interval);
    screen.style.opacity = "0";
    screen.style.visibility = "hidden";
    main.style.visibility = "visible";
    main.style.opacity = "1";
  }

  // Fallback auto-entry after 6 seconds
  setTimeout(enterSite, 6000);
  screen.addEventListener("click", enterSite);
</script>

</body>
</html>
