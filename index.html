<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sohaan Chhabra Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="./main.3f6952e4.css" rel="stylesheet">

  <style>
    .hero {
  position: relative;
  color: #fff;
}

/* DARK OVERLAY for readability */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6); /* adjust 0.6 → 0.75 if needed */
  z-index: 1;
}

/* Keep text above overlay */
.hero h1,
.hero span {
  position: relative;
  z-index: 2;
}

/* EXTRA VISIBILITY BOOST */
.hero h1 {
  color: #ffffff;
  text-shadow: 0 0 10px rgba(255,255,255,0.6),
               0 0 25px rgba(255,255,255,0.3);
}

.hero span {
  color: #e0e0e0;
}
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: black;
    }

    /* ===== GREETING SCREEN ===== */
    #greeting-screen {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at center, #111, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    .greetings {
      font-size: 3rem;
      color: white;
      text-align: center;
      letter-spacing: 2px;
    }

    .greetings span {
      display: none;
      animation: fade 0.8s ease;
    }

    .greetings span.active {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .skip-text {
      position: absolute;
      bottom: 40px;
      font-size: 0.9rem;
      opacity: 0.6;
      color: white;
    }

    /* ===== MAIN CONTENT ===== */
    #main-content {
      display: none;
      height: 100%;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
                  url('./assets/images/space.jpg') center/cover;
    }

    .hero h1 {
      font-size: 3.5rem;
      line-height: 1.3;
      animation: fadeUp 1s ease;
    }

    .hero span {
      display: block;
      font-size: 1.2rem;
      opacity: 0.7;
      margin-top: 10px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Navbar fix */
    .navbar {
      background: transparent;
      border: none;
    }

  </style>
</head>

<body>

<!-- GREETING SCREEN -->
<div id="greeting-screen">
  <div class="greetings" id="greetings">
    <span class="active">Hello</span>
    <span>नमस्ते</span>
    <span>こんにちは</span>
    <span>안녕하세요</span>
    <span>مرحبا</span>
    <span>Привет</span>
    <span>你好</span>
    <span>שלום</span>
  </div>
  <div class="skip-text">click anywhere to skip</div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">

  <header>
    <nav class="navbar navbar-fixed-top navbar-inverse">
      <div class="container">
        <div class="collapse navbar-collapse" id="navbar-collapse">
          <ul class="nav navbar-nav">
            <li><a href="./index.html">01 : Home</a></li>
            <li><a href="./works.html">02 : Projects</a></li>
            <li><a href="./about.html">03 : About me</a></li>
            <li><a href="./contact.html">04 : Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="hero">
    <h1>
      Hello,<br>
      I'm Sohaan Chhabra
      <span>Robotics • Drones • Engineering</span>
    </h1>
  </div>

</div>

<script>
  const greetings = document.querySelectorAll("#greetings span");
  let index = 0;

  function cycleGreetings() {
    greetings.forEach(el => el.classList.remove("active"));
    greetings[index].classList.add("active");
    index = (index + 1) % greetings.length;
  }

  let interval = setInterval(cycleGreetings, 600);

  function enterSite() {
    clearInterval(interval);
    const screen = document.getElementById("greeting-screen");
    screen.style.opacity = "0";

    setTimeout(() => {
      screen.style.display = "none";
      document.getElementById("main-content").style.display = "block";
    }, 600);
  }

  // Auto enter after 3 sec
  setTimeout(enterSite, 3000);

  // Click to skip
  document.getElementById("greeting-screen").addEventListener("click", enterSite);

</script>

<script src="./main.70a66962.js"></script>

</body>
</html>
