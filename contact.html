<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Sohaan Chhabra</title>

  <link href="./assets/favicon.ico" rel="icon">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #111, #000);
      color: white;
    }

    /* NAV */
    .navbar {
      display: flex;
      gap: 25px;
      padding: 20px 40px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    .navbar a {
      color: #aaa;
      text-decoration: none;
      transition: 0.3s;
    }

    .navbar a:hover,
    .navbar a.active {
      color: #fff;
    }

    /* MAIN */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      padding: 20px;
    }

    /* CARD */
    .contact-card {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    /* BUTTONS */
    .contact-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      background: #1a1a1a;
      border: 1px solid #333;
      transition: 0.3s;
    }

    .contact-btn:hover {
      transform: translateY(-3px);
      background: #222;
      border-color: #555;
    }

    /* SOCIAL */
    .socials {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .socials a {
      font-size: 20px;
      color: #aaa;
      transition: 0.3s;
    }

    .socials a:hover {
      color: white;
      transform: scale(1.2);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 10px;
      color: #666;
      font-size: 12px;
    }

  </style>

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

  <!-- NAV -->
  <div class="navbar">
    <a href="./index.html">Home</a>
    <a href="./works.html">Works</a>
    <a href="./about.html">About</a>
    <a href="./contact.html" class="active">Contact</a>
  </div>

  <!-- MAIN -->
  <div class="container">

    <div class="contact-card">

      <h1>Contact Me</h1>
      <p>Let’s build something cool together</p>

      <!-- CONTACT BUTTONS -->
      <a href="tel:+919229224994" class="contact-btn">
        📞 +91 9229224994
      </a>

      <a href="mailto:contact.sohaan@gmail.com" class="contact-btn">
        ✉️ contact.sohaan@gmail.com
      </a>

      <a href="#" class="contact-btn">
        📍 Bhopal, India
      </a>

      <!-- SOCIALS -->
      <div class="socials">
        <a href="https://twitter.com/SohaanChhabra"><i class="fab fa-twitter"></i></a>
        <a href="https://www.linkedin.com/in/sohaan-chhabra-966198336/"><i class="fab fa-linkedin"></i></a>
      </div>

    </div>

  </div>

  <div class="footer">
    © 2026 Sohaan Chhabra
  </div>

</body>
</html>
